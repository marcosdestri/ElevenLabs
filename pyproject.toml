[project]
name = "enterprise-ai-workflows"
description = "Portfolio of enterprise AI workflow prototypes — business problem to practical implementation"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["python-agent/tests"]
pythonpath = ["python-agent"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["n8n-workflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
